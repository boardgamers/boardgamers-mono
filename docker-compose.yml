services:
  mongo:
    image: mongo:8
    command: --replSet rs0 --bind_ip_all
    ulimits:
      nofile:
        soft: 64000
        hard: 64000
    mem_limit: "5g"
    mem_reservation: "3g"
    healthcheck:
      # The initiated member must be named "localhost:27017" (not the published host
      # port) so the rs-initiated replica-set URL matches what `podman exec ... mongosh`
      # resolves to. Drivers must connect with ?replicaSet=rs0&directConnection=true
      # so they don't re-resolve "localhost" (which would fail outside this host).
      test: test $$(mongosh --quiet --eval 'try {rs.status().ok} catch(e) {rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]}).ok}') -eq 1
      interval: 5s
    volumes:
      - mongo-data:/data/db
    ports:
      - ${LOCAL_MONGO_PORT:-27517}:27017
  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minio123}
      MINIO_SERVER_URL: ${S3_ENDPOINT:-http://localhost:9000}
    healthcheck:
      test: mc ready local || exit 1
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - minio-data:/data
    ports:
      - ${LOCAL_S3_PORT:-9000}:9000
      - ${LOCAL_S3_CONSOLE_PORT:-9001}:9001
  createbuckets:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${S3_ACCESS_KEY_ID:-minio} $${S3_SECRET_ACCESS_KEY:-minio123}
      && mc mb --ignore-existing local/$${S3_BUCKET:-bgs-assets}
      && mc anonymous set download local/$${S3_BUCKET:-bgs-assets};
      "
volumes:
  mongo-data:
  minio-data:
