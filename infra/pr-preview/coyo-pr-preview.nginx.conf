# Wildcard vhost for ephemeral PR preview envs (issue #120).
# TLS: wildcard cert *.boardgamers.space (dns-namecheap plugin, auto-renewed via
# /usr/local/bin/certbot-renew — see infra/pr-preview/).
# The workflow tears envs down on PR close; a stale env returns 502 (harmless).
#
# Env ports on the minipc are (base + pr): web 12000+n, api 13000+n,
# gameplay 14000+n, ws 15000+n, resources 16000+n. nginx has no arithmetic, so
# the port is built by zero-padding the PR number to 3 digits (PRs are < 1000 in
# practice) and concatenating onto the base prefix: 12 . 099 for PR 99.
map $host $bgs_preview_pr {
  ~*^pr-([0-9]+)\\.boardgamers\\.space$ $1;
  default "";
}
# Admin panel per env, on a single-level dash-subdomain (admin-pr-<n>) because the
# *.boardgamers.space cert can't cover the two-level admin.pr-<n>.boardgamers.space.
map $host $bgs_preview_admin_pr {
  ~*^admin-pr-([0-9]+)\\.boardgamers\\.space$ $1;
  default "";
}
# Docs per env, same single-level pattern (docs-pr-<n>).
map $host $bgs_preview_docs_pr {
  ~*^docs-pr-([0-9]+)\\.boardgamers\\.space$ $1;
  default "";
}
map $bgs_preview_pr $bgs_preview_suffix {
  ~*^([0-9])$        "00$1";
  ~*^([0-9][0-9])$   "0$1";
  ~*^([0-9][0-9][0-9])$ "$1";
  default "";
}
map $bgs_preview_admin_pr $bgs_preview_admin_suffix {
  ~*^([0-9])$        "00$1";
  ~*^([0-9][0-9])$   "0$1";
  ~*^([0-9][0-9][0-9])$ "$1";
  default "";
}
map $bgs_preview_docs_pr $bgs_preview_docs_suffix {
  ~*^([0-9])$        "00$1";
  ~*^([0-9][0-9])$   "0$1";
  ~*^([0-9][0-9][0-9])$ "$1";
  default "";
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name ~^pr-[0-9]+\.boardgamers\.space$;

  ssl_certificate     /etc/letsencrypt/live/wildcard.boardgamers.space/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/wildcard.boardgamers.space/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  if ($bgs_preview_suffix = "") { return 404; }

  location /ws {
    proxy_pass http://10.90.0.2:15$bgs_preview_suffix;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
  }
  location /api/gameplay { proxy_pass http://10.90.0.2:14$bgs_preview_suffix; }
  location /api          { proxy_pass http://10.90.0.2:13$bgs_preview_suffix; }
  # Social-OAuth start + callback are api routes at the top level (#248).
  location /auth         { proxy_pass http://10.90.0.2:13$bgs_preview_suffix; }
  location /resources/ {
    # resources server mounts routes without the /resources prefix (prod uses the
    # resources. subdomain), so strip it before proxying.
    rewrite ^/resources(/.*)$ $1 break;
    proxy_pass http://10.90.0.2:16$bgs_preview_suffix;
  }

  # Session cookie scope: the api sets the refreshToken cookie with Domain=env.domain
  # (pr-<n>.boardgamers.space) for any public request host. Here host == Domain, so the
  # cookie is valid as-is — but strip the attribute anyway so it is stored HOST-ONLY
  # (pr-<n>.boardgamers.space exactly), keeping preview sessions off every other host.
  proxy_cookie_domain pr-$bgs_preview_pr.boardgamers.space $host;

  location /             { proxy_pass http://10.90.0.2:12$bgs_preview_suffix; }

  # Cross-origin isolation: prod sets these (see the boardgamers.space vhost) so
  # engines/viewers that use SharedArrayBuffer (wasm threads, shared state) work.
  # Without them the page isn't cross-origin isolated and SharedArrayBuffer is
  # undefined in the browser. credentialless allows the cross-origin CDN scripts.
  add_header Cross-Origin-Embedder-Policy credentialless;
  add_header Cross-Origin-Opener-Policy same-origin;

  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header Host $host;
  proxy_read_timeout 3600s; # slow first-hit engine installs
}

# Admin SPA per env: static files on the env's admin port (17000+n), /api proxied to
# the env's api/gameplay. The SPA calls relative /api (apps/admin/src/lib/api.ts).
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name ~^admin-pr-[0-9]+\\.boardgamers\\.space$;

  ssl_certificate     /etc/letsencrypt/live/wildcard.boardgamers.space/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/wildcard.boardgamers.space/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  if ($bgs_preview_admin_suffix = "") { return 404; }

  # Session cookie scope: the api sets the refreshToken cookie with Domain=env.domain
  # (pr-<n>.boardgamers.space) — but this request's host is admin-pr-<n>.boardgamers.space,
  # a SIBLING of pr-<n>, not a subdomain (the single-level wildcard cert can't cover
  # admin.pr-<n>). Per RFC 6265 §5.1.3 the browser would REJECT that cookie here ("invalid
  # domain"), breaking admin login. Rewrite Domain to the admin host itself: the browser
  # stores it host-only (admin-pr-<n> exactly), so the session lives only on this preview's
  # admin host and never touches the prod boardgamers.space namespace.
  proxy_cookie_domain pr-$bgs_preview_admin_pr.boardgamers.space $host;

  location /api/gameplay { proxy_pass http://10.90.0.2:14$bgs_preview_admin_suffix; }
  location /api          { proxy_pass http://10.90.0.2:13$bgs_preview_admin_suffix; }
  location /             { proxy_pass http://10.90.0.2:17$bgs_preview_admin_suffix; }

  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header Host $host;
}

# Docs per env: the self-hosted docs server (apps/docs) on the env's docs port
# (18000+n). Content negotiation (Accept: text/markdown, .md suffix) is handled by
# the docs server itself — nginx just proxies.
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name ~^docs-pr-[0-9]+\\.boardgamers\\.space$;

  ssl_certificate     /etc/letsencrypt/live/wildcard.boardgamers.space/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/wildcard.boardgamers.space/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  if ($bgs_preview_docs_suffix = "") { return 404; }

  location / { proxy_pass http://10.90.0.2:18$bgs_preview_docs_suffix; }

  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header Host $host;
}

server {
  listen 80;
  listen [::]:80;
  server_name ~^(admin-|docs-)?pr-[0-9]+\\.boardgamers\\.space$;
  return 301 https://$host$request_uri;
}
