# Control plane for PR preview envs (issue #120). The GitHub workflow calls this
# to create/delete envs; it proxies to preview-api on the minipc over WireGuard.
# Separate, tighter host than the public pr-<n> wildcard. Bearer auth enforced
# upstream by preview-api itself (the secret never lives on coyo).
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name pr-preview-api.boardgamers.space;

  ssl_certificate     /etc/letsencrypt/live/wildcard.boardgamers.space/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/wildcard.boardgamers.space/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  location / {
    proxy_pass http://10.90.0.2:9900;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
