# docs.boardgamers.space — self-hosted docs (apps/docs, PM2 `docs` on [::1]:8620).
# Replaces the old GitHub-Pages VuePress site (boardgamers.github.io).
# TLS: wildcard cert *.boardgamers.space (same lineage as the other vhosts).
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name docs.boardgamers.space;

  ssl_certificate     /etc/letsencrypt/live/wildcard.boardgamers.space/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/wildcard.boardgamers.space/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  location / {
    proxy_pass http://[::1]:8620;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

server {
  listen 80;
  listen [::]:80;
  server_name docs.boardgamers.space;
  return 301 https://$host$request_uri;
}
