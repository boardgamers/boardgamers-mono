version: "3.8"

# Loki logging stack for boardgamers.space
# Grafana (3030)  — dashboards at https://grafana.boardgamers.space  (OAuth only, admins; emergency password backdoor — see GF_SECURITY_ADMIN_PASSWORD)
# Loki   (3100)  — log storage, internal only
# Promtail (9080) — tails PM2 logs, internal only
#
# Runs on the prod box as ROOTLESS PODMAN under the `bgs` user (no docker on that
# box), auto-started by bgs-loki.service (`podman-compose up --no-recreate`).
# Deploy:  ssh bgs, then: cd boardgamers-mono/infra/loki && podman-compose up -d
# Note: a container's env (e.g. GF_AUTH_GENERIC_OAUTH_*) is baked in at creation —
# changing it needs a recreate, not a restart:
#   podman-compose up -d --force-recreate --no-deps grafana
# (podman-compose 0.0.1 ignores --no-deps and recreates loki too — harmless, it
# comes back in seconds with its volume intact; promtail is correctly skipped.)

services:
  loki:
    image: docker.io/grafana/loki:3.0.0
    container_name: bgs-loki
    restart: unless-stopped
    # cap so a Loki mem spike is OOM-killed+restarted instead of starving the 32GB box — hit 18GB on 2026-08-04 after a promtail backfill
    mem_limit: 4g
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml

  promtail:
    image: docker.io/grafana/promtail:3.0.0
    container_name: bgs-promtail
    restart: unless-stopped
    mem_limit: 512m
    ports:
      - "127.0.0.1:9080:9080"
    volumes:
      - ./promtail-config.yaml:/etc/promtail/config.yaml
      - /home/bgs/.pm2/logs:/logs:ro
    command: -config.file=/etc/promtail/config.yaml

  grafana:
    image: docker.io/grafana/grafana:11.0.0
    container_name: bgs-grafana
    restart: unless-stopped
    mem_limit: 1g
    ports:
      - "127.0.0.1:3030:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      # GF_SECURITY_ADMIN_PASSWORD is only read on first DB init; afterwards the password
      # lives in the grafana-data volume. The committed default below is overwritten on
      # fresh installs by setting GRAFANA_ADMIN_PASSWORD in the env. To rotate an existing
      # install: `podman exec bgs-grafana grafana-cli admin reset-admin-password <pw>`.
      # Current password is stored out-of-band at /home/bgs/.grafana-admin-password (chmod 600).
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      # OAuth (OIDC via www.boardgamers.space, CIMD + PKCE — no real client secret) is the
      # ONLY login: the password form is disabled below. Access is restricted to admins
      # only — the `authority` claim is emitted by the API solely for admin users, so
      # anyone else gets no mapped role and the strict-role setting denies their login.
      # nginx serves the client metadata at /client-metadata.json
      # (see infra/loki/grafana.boardgamers.space).
      - GF_SERVER_ROOT_URL=https://grafana.boardgamers.space
      - GF_AUTH_GENERIC_OAUTH_ENABLED=true
      - GF_AUTH_GENERIC_OAUTH_NAME=Boardgamers
      - GF_AUTH_GENERIC_OAUTH_CLIENT_ID=https://grafana.boardgamers.space/client-metadata.json
      # Grafana always sends a client_secret; the API tolerates exactly this
      # placeholder (and no other value) — it authenticates nothing, PKCE is the
      # only client-auth mechanism.
      - GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET=__UNUSED__
      - GF_AUTH_GENERIC_OAUTH_USE_PKCE=true
      - GF_AUTH_GENERIC_OAUTH_AUTH_URL=https://www.boardgamers.space/api/oauth2/authorize
      - GF_AUTH_GENERIC_OAUTH_TOKEN_URL=https://www.boardgamers.space/api/oauth2/token
      - GF_AUTH_GENERIC_OAUTH_API_URL=https://www.boardgamers.space/api/oauth2/userinfo
      - GF_AUTH_GENERIC_OAUTH_SCOPES=openid profile email role
      - GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH=sub
      # JMESPath — keep exact. admin => GrafanaAdmin; non-admin => no mapped role,
      # which ROLE_ATTRIBUTE_STRICT turns into a login denial (non-admin => denied).
      - GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH=authority == 'admin' && 'GrafanaAdmin' || null
      - GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN=true
      - GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT=true
      # Password login form disabled — OAuth confirmed working. The GF_SECURITY_ADMIN_*
      # envs above stay as an emergency backdoor (reset via grafana-cli, see note above).
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    depends_on:
      - loki

volumes:
  loki-data:
  grafana-data:
