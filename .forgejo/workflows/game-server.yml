name: Game-Server
on:
  push:
    paths:
      - ".forgejo/workflows/game-server.yml"
      - "apps/game-server/**"
      - "packages/**"
    branches:
      - main
  pull_request:
    paths:
      - ".forgejo/workflows/game-server.yml"
      - "apps/game-server/**"
      - "packages/**"

defaults:
  run:
    working-directory: apps/game-server

jobs:
  lint:
    runs-on: docker
    # Image pinned per job so CI does not depend on the runner's default-image
    # mapping for the "docker" label; node:24-bookworm ships node + corepack.
    container:
      image: docker.io/library/node:24-bookworm
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
      - run: corepack enable
      - run: pnpm install --filter {./}...
      - run: pnpm run lint-check
      - run: pnpm run tsc
