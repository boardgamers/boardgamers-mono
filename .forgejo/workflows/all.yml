name: All
on: [pull_request, push]

jobs:
  format:
    runs-on: docker
    # Image pinned per job so CI does not depend on the runner's default-image
    # mapping for the "docker" label; node:24-bookworm ships node + corepack.
    container:
      image: docker.io/library/node:24-bookworm
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
      # corepack fetches the pnpm version pinned by package.json's packageManager field.
      - run: corepack enable
      - run: pnpm install
      # oxfmt formats JS/TS/YAML/MD/JSON across the repo (Svelte excluded — oxfmt's
      # Svelte parser is still beta). Svelte files are checked by prettier.
      - run: pnpm run format-check
      - run: cd apps/admin && npx prettier --check "src/**/*.svelte"
      - run: cd apps/web && npx prettier --check "src/**/*.svelte"
