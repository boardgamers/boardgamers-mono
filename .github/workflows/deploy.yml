name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a burst of merges keeps only the newest queued run
# (each deploys origin/main's tip, so intermediate runs are redundant).
# scripts/deploy-remote.sh also holds a server-side flock as a second line
# of defense.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # server_url: Forgejo (Codeberg) would fall through to .github/workflows if
    # .forgejo/workflows were ever removed — this gate keeps that safe;
    # .forgejo/workflows/deploy.yml carries the Codeberg equivalent.
    if: github.server_url == 'https://github.com' && github.repository == 'boardgamers/boardgamers-mono'
    timeout-minutes: 10
    environment: deploy
    steps:
      - name: Checkout (for the remote deploy script)
        uses: actions/checkout@v4

      - name: Deploy to coyo
        env:
          SSH_KEY: ${{ secrets.COYO_SSH_KEY }}
          SSH_HOST: ${{ secrets.COYO_SSH_HOST }}
          SSH_PORT: ${{ secrets.COYO_SSH_PORT || '22' }}
          KNOWN_HOSTS: ${{ secrets.COYO_KNOWN_HOSTS }}
          # The server checkout's origin may still point at the old forge
          # (Codeberg→GitHub move); the script repoints it to this before fetching.
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail

          # Write the private key
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/coyo_deploy_key
          chmod 600 ~/.ssh/coyo_deploy_key

          # Pin the host key (prevents MITM, avoids ssh-keyscan)
          if [ -n "$KNOWN_HOSTS" ]; then
            echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            # Fallback: trust-on-first-use keyscan
            ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi

          # Run the deploy script on the server. Piping the checked-in script to
          # 'bash -s' over ssh stdin avoids the fragile multi-level quoting of
          # 'ssh bash -lc "..."' (which expanded $prev to empty in CI and broke
          # the deploy twice). The script lives in scripts/deploy-remote.sh.
          # REPO_URL is passed as the script's $1 (the args after 'bash -s' go to
          # the remote bash): env vars don't cross the ssh boundary, so it can't
          # go through the script's environ. Quoted for the REMOTE shell — the
          # URL has no spaces/metachars, so double-quoting is safe.
          ssh -i ~/.ssh/coyo_deploy_key -p "$SSH_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes bgs@"$SSH_HOST" "bash -s -- '$REPO_URL'" < scripts/deploy-remote.sh
