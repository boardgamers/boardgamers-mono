name: Game-Server
on:
  push:
    paths:
      - ".github/workflows/game-server.yml"
      - "apps/game-server/**"
      - "packages/**"
    branches:
      - main
  pull_request:
    paths:
      - ".github/workflows/game-server.yml"
      - "apps/game-server/**"
      - "packages/**"

defaults:
  run:
    working-directory: apps/game-server

jobs:
  lint:
    runs-on: ubuntu-latest
    # Forgejo (Codeberg) would fall through to .github/workflows if .forgejo/workflows
    # were ever removed — this gate keeps that safe (on Forgejo, server_url is the
    # instance URL); .forgejo/workflows/ carries the Codeberg equivalents.
    if: github.server_url == 'https://github.com'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: corepack enable
      - run: pnpm install --filter {./}...
      - run: pnpm run lint-check
      - run: pnpm run tsc
