name: PR Preview

# Ephemeral env per PR on the home minipc (issue #120). Spins a rootless Podman
# container (web+api+game-server from the PR commit, own bgs-pr-<n> db from the
# nightly sanitized dump) and surfaces the URL as a GitHub Deployment
# (pr-<n> environment, view-deployment button on the PR). Capped at 5 concurrent
# envs by the preview-api; teardown on close/unlabel.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, closed, labeled, unlabeled]

permissions:
  deployments: write

jobs:
  preview:
    runs-on: ubuntu-latest
    if: github.repository == 'boardgamers/boardgamers-mono'
    timeout-minutes: 15
    steps:
      - name: Check gate (MEMBER or preview label)
        id: gate
        env:
          ASSOCIATION: ${{ github.event.pull_request.author_association }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          ACTION: ${{ github.event.action }}
        run: |
          ok=false
          if [ "$ASSOCIATION" = "MEMBER" ] || [ "$ASSOCIATION" = "OWNER" ] || [ "$ASSOCIATION" = "COLLABORATOR" ]; then ok=true; fi
          if echo "$LABELS" | grep -q '"preview"'; then ok=true; fi
          echo "allowed=$ok" >> "$GITHUB_OUTPUT"
          echo "association=$ASSOCIATION labels=$LABELS → allowed=$ok"

      - name: Tear down (PR closed, or label removed from non-member)
        if: steps.gate.outputs.allowed == 'false' || github.event.action == 'closed'
        env:
          PREVIEW_SECRET: ${{ secrets.PREVIEW_SECRET }}
        run: |
          curl -sf -X DELETE \
            -H "Authorization: Bearer $PREVIEW_SECRET" \
            https://pr-preview-api.boardgamers.space/envs/${{ github.event.pull_request.number }} || true
          echo "env torn down"

      - name: Mark deployment inactive on teardown
        if: steps.gate.outputs.allowed == 'false' || github.event.action == 'closed'
        uses: actions/github-script@v7
        with:
          script: |
            const env = `pr-${context.issue.number}`;
            const { data: deployments } = await github.rest.repos.listDeployments({
              owner: context.repo.owner, repo: context.repo.repo, environment: env,
            });
            for (const d of deployments) {
              await github.rest.repos.createDeploymentStatus({
                owner: context.repo.owner, repo: context.repo.repo,
                deployment_id: d.id, state: "inactive",
                description: "Preview torn down",
              });
            }

      - name: Create/update env
        if: steps.gate.outputs.allowed == 'true' && github.event.action != 'closed'
        id: env
        env:
          PREVIEW_SECRET: ${{ secrets.PREVIEW_SECRET }}
          SHA: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          response=$(curl -sf -X PUT \
            -H "Authorization: Bearer $PREVIEW_SECRET" \
            -H "content-type: application/json" \
            -d "{\"sha\": \"$SHA\"}" \
            https://pr-preview-api.boardgamers.space/envs/$PR) || {
            echo "preview-api refused (likely at the 5-env cap) — try again after another PR's env is torn down"
            exit 1
          }
          url=$(echo "$response" | jq -r .url)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Register a GitHub Deployment
        if: steps.env.outputs.url
        uses: actions/github-script@v7
        with:
          script: |
            const url = process.env.PREVIEW_URL;
            const pr = context.payload.pull_request;
            // One environment per PR; a fresh deployment on every push so the
            // "view deployment" button always tracks the latest sha.
            const { data: deployment } = await github.rest.repos.createDeployment({
              owner: context.repo.owner, repo: context.repo.repo,
              ref: pr.head.sha,
              environment: `pr-${pr.number}`,
              description: "Ephemeral preview on the minipc",
              auto_merge: false,
              required_contexts: [],
              transient_environment: true,
            });
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner, repo: context.repo.repo,
              deployment_id: deployment.id,
              state: "success",
              environment_url: url,
              log_url: url,
              description: `Preview ready: ${url}`,
            });
        env:
          PREVIEW_URL: ${{ steps.env.outputs.url }}
